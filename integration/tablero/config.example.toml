# For the private NUKE-72 adapter only. Relative to this file's directory.
[appearance]
theme_file = "../../themes/swatches.toml"

# Font size, geometry, producer selection, and state overrides remain app-owned.
[font]
size = 14.0

[bar]
modules-left = ["workspaces"]
modules-center = ["title"]
modules-right = ["clock"]

# Uncomment to mask the shared accent on one output:
# [[monitor]]
# name = "DP-1"
# [monitor.theme]
# accent = "#FFFFFF"
